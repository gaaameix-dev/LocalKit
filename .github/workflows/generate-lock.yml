name: Generate lockfile once

# Temporary workflow: generates and commits package-lock.json the first time
# the repository is pushed without one, so that the deployment workflow's
# `npm ci` step has a committed lockfile. Self-disabling: if the lockfile
# already exists, it does nothing.

on:
  push:
    branches: [deploy-v912, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package-lock.json if missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Generate package-lock.json"
            git push
          else
            echo "package-lock.json present — nothing to do"
          fi
