name: Apply V9.4.0 settings + stopwatch patches

# Temporary workflow: applies the exact-match V9.4.0 patches (full Settings
# section + Stopwatch/Timer tool), regenerates package-lock.json, commits and
# removes its own helper files.

on:
  push:
    branches: [ui-v94]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact-match patches
        run: python3 patches-v94.py

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit V9.4.0 changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/styles.css package.json scripts/verify.mjs README.md BUILD-VERIFICATION.md package-lock.json
          git rm -q patches-v94.py
          git rm -q .github/workflows/apply-v94.yml || true
          git commit -m "Add LocalKit V9.4.0: Settings section and Stopwatch tool"
          git push
