name: Apply V9.2.0 UI patches

# Temporary workflow: applies the exact-match V9.2.0 UI patches to src/main.tsx
# and the version/docs files, regenerates package-lock.json for the new version,
# commits everything and removes its own helper files.

on:
  push:
    branches: [ui-v92]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact-match patches
        run: python3 patches-v92.py

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit V9.2.0 changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx package.json scripts/verify.mjs README.md BUILD-VERIFICATION.md package-lock.json
          git rm -q patches-v92.py
          git rm -q .github/workflows/apply-v92.yml || true
          git commit -m "Apply LocalKit V9.2.0 premium UI (main.tsx patches + lockfile sync)"
          git push
