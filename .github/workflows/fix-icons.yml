name: Restore icons once

# Temporary workflow: decodes the two committed *.png.gz.b64 text files back
# into byte-exact PNG icons (verified with sha256 before anything is written),
# commits the restored icons, and removes its own helper files.

on:
  push:
    branches: [deploy-v912, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode, verify and install icons
        run: |
          set -e
          if [ ! -f icon-192.png.gz.b64 ] && [ ! -f icon-512.png.gz.b64 ]; then
            echo "helper files already removed — nothing to do"
            exit 0
          fi
          EXPECTED_192="b95ecba9a29efc8bc3942c8c3f0967a7adb42174c474d94f0e286699bddc3ee3"
          EXPECTED_512="d3388df84418285429634efbda7960f37410170339d221c671f9cb90f5e7ad59"
          base64 -d icon-192.png.gz.b64 | gunzip > /tmp/icon-192.png
          base64 -d icon-512.png.gz.b64 | gunzip > /tmp/icon-512.png
          echo "$EXPECTED_192  /tmp/icon-192.png" | sha256sum -c -
          echo "$EXPECTED_512  /tmp/icon-512.png" | sha256sum -c -
          mkdir -p public/icons
          mv /tmp/icon-192.png public/icons/icon-192.png
          mv /tmp/icon-512.png public/icons/icon-512.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/icon-192.png public/icons/icon-512.png
          git rm -q icon-192.png.gz.b64 icon-512.png.gz.b64
          git rm -q .github/workflows/fix-icons.yml || true
          git commit -m "Restore byte-exact PNG icons (sha256 verified)"
          git push
